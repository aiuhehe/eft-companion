<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EFT コンパニオン</title>
<script>
// 最後に使ったテーマの色を、CDN やアプリの読み込みより前に当てる（起動時の全画面ローディングもテーマの色で出すため・Issue #24）。
// 値は applyTheme() が eft_theme_vars_v1 に保存する
try {
  var v = JSON.parse(localStorage.getItem('eft_theme_vars_v1') || 'null');
  if (v) for (var k in v) if (/^--[a-z-]+$/.test(k)) document.documentElement.style.setProperty(k, String(v[k]));
} catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 起動時の全画面ローディング（Issue #24）。React・Babel の読み込み中も出し、描画されたら App の同じ表示に置き換わる -->
<div id="root"><div class="app-loading-overlay" role="status" aria-live="polite"><div class="app-loading-morph"></div><div class="app-loading-text">loading...</div></div></div>
<!-- CDN のスクリプトはローディングより後に置く（head に置くとダウンロードが終わるまで画面が真っ白のまま＝回線が遅いとローディングが出ない・Issue #24） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script src="guides-data.js"></script>
<script type="text/babel" data-presets="react">
